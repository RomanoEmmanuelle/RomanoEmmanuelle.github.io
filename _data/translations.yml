"Running": "ランニング"
"Romano Emmanuelle running outdoors": "屋外で走るRomano Emmanuelle"
"I was obese in 2023, and going to the gym was how I lost weight. However, in October 2025, I was hit by a taxi. After that, the gym was no longer an option for me, so I had to find a way to maintain my weight without relying on my arms—and that was how I started running.": "2023年、私は肥満でしたが、ジムに通って減量しました。しかし、2025年10月にタクシーにはねられ、その後はジムに通うことができなくなりました。腕に負担をかけずに体重を維持する方法を探したことが、ランニングを始めたきっかけです。"
