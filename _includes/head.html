{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.classList.replace('no-js', 'js');
  document.documentElement.classList.add('CSSViewTransitionRule' in window ? 'page-transitions-native' : 'page-transitions-fallback');
  // Apply the saved/system theme before the first paint, including when storage is blocked.
  var initialTheme;
  try { initialTheme = localStorage.getItem('theme'); } catch (error) {}
  if (initialTheme !== 'light' && initialTheme !== 'dark') {
    initialTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  if (initialTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v=transitions-1">
<script id="site-translations" type="application/json">{{ site.data.translations | jsonify }}</script>
<script defer src="{{ base_path }}/assets/js/language.js?v=4"></script>
