{% assign running = site.data.running_year %}
<section class="running-year" aria-labelledby="running-year-title">
  <div class="running-year__heading">
    <h2 id="running-year-title">Running in {{ running.year }}</h2>
    <p><span>Updated</span> <time datetime="{{ running.updated }}">{{ running.updated_label }}</time></p>
  </div>
  <dl class="running-year__stats">
    <div><dt>Total distance</dt><dd>{{ running.distance_km }} <span>km</span></dd></div>
    <div><dt>Time running</dt><dd>{{ running.moving_hours }} <span>h</span> {{ running.moving_minutes }} <span>min</span></dd></div>
  </dl>
</section>
